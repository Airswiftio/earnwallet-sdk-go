components:
    schemas:
        Chain:
            properties:
                chain:
                    description: Name to pass as the chain parameter
                    type: string
                chain_type:
                    description: evm, svm or tvm; decides the address format
                    type: string
                confirmations:
                    description: Depth a deposit must reach before its callback is sent
                    format: int64
                    type: integer
                tokens:
                    format: '[]v1.Token'
                    items:
                        $ref: '#/components/schemas/Token'
                        description: ""
                    type: array
            type: object
        CreateWithdrawalReq:
            properties:
                amount:
                    description: Decimal string; more precision than the token has is refused, not rounded
                    type: string
                chain:
                    description: Chain name as configured, lower case
                    type: string
                external_id:
                    description: Caller's order id; also the idempotency key
                    maxLength: 64
                    minLength: 1
                    type: string
                to_address:
                    description: Destination address
                    type: string
                token_id:
                    description: Token contract address; must be configured for withdrawal
                    type: string
            required:
                - external_id
                - chain
                - token_id
                - to_address
                - amount
            type: object
        CreateWithdrawalRes:
            properties:
                external_id:
                    type: string
                status:
                    type: string
            required:
                - external_id
                - status
            type: object
        Deposit:
            properties:
                address:
                    type: string
                amount:
                    type: string
                block_height:
                    type: string
                block_time:
                    type: string
                chain:
                    type: string
                confirmed_at:
                    format: date-time
                    type: string
                currency:
                    type: string
                decimals:
                    format: uint8
                    type: integer
                event_id:
                    type: string
                from_address:
                    type: string
                raw_amount:
                    type: string
                token_id:
                    type: string
                transfer_index:
                    format: int64
                    type: integer
                tx_hash:
                    type: string
                txid:
                    type: string
            type: object
        Error:
            properties:
                code:
                    description: 0 on success; any other value is a business failure.
                    type: integer
                message:
                    type: string
            required:
                - code
                - message
            type: object
        GetWalletReq:
            properties:
                address:
                    description: Look up the seed that owns this address
                    type: string
                chain:
                    description: Chain name as configured, lower case, e.g. bsc
                    type: string
                seed:
                    description: Look up this seed; omit both seed and address to take a new one
                    format: int64
                    type: integer
            required:
                - chain
            type: object
        GetWalletRes:
            properties:
                address:
                    type: string
                chain:
                    type: string
                factory:
                    description: The factory this address was derived under
                    type: string
                seed:
                    description: Identifies this wallet on every chain, not just this one
                    format: int64
                    type: integer
            required:
                - address
                - chain
                - factory
                - seed
            type: object
        GetWithdrawalReq:
            properties:
                external_id:
                    type: string
            required:
                - external_id
            type: object
        GetWithdrawalRes:
            properties:
                amount:
                    type: string
                chain:
                    type: string
                confirmed_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                external_id:
                    type: string
                failed_reason:
                    type: string
                held_reason:
                    type: string
                status:
                    type: string
                to_address:
                    type: string
                token_id:
                    type: string
                tx_hash:
                    type: string
            required:
                - amount
                - chain
                - confirmed_at
                - created_at
                - external_id
                - failed_reason
                - held_reason
                - status
                - to_address
                - token_id
                - tx_hash
            type: object
        ListChainsReq:
            properties: {}
            type: object
        ListChainsRes:
            properties:
                chains:
                    format: '[]v1.Chain'
                    items:
                        $ref: '#/components/schemas/Chain'
                        description: ""
                    type: array
            required:
                - chains
            type: object
        ListDepositsReq:
            properties:
                chain:
                    description: Limit to one chain
                    type: string
                page:
                    default: 1
                    format: int64
                    minimum: 1
                    type: integer
                since:
                    description: Credited at or after this instant, RFC3339
                    format: date-time
                    nullable: true
                    type: string
                size:
                    default: 50
                    format: int64
                    maximum: 200
                    minimum: 1
                    type: integer
                until:
                    description: Credited strictly before this instant, RFC3339
                    format: date-time
                    nullable: true
                    type: string
            type: object
        ListDepositsRes:
            properties:
                items:
                    format: '[]*v1.Deposit'
                    items:
                        $ref: '#/components/schemas/Deposit'
                        description: ""
                    type: array
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
            type: object
        ListWithdrawalsReq:
            properties:
                chain:
                    description: Limit to one chain
                    type: string
                page:
                    default: 1
                    format: int64
                    minimum: 1
                    type: integer
                since:
                    description: Created at or after this instant, RFC3339
                    format: date-time
                    nullable: true
                    type: string
                size:
                    default: 50
                    format: int64
                    maximum: 200
                    minimum: 1
                    type: integer
                status:
                    description: accepted, held, planned, confirmed or failed
                    type: string
                until:
                    description: Created strictly before this instant, RFC3339
                    format: date-time
                    nullable: true
                    type: string
            type: object
        ListWithdrawalsRes:
            properties:
                items:
                    format: '[]*v1.Withdrawal'
                    items:
                        $ref: '#/components/schemas/Withdrawal'
                        description: ""
                    type: array
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
            type: object
        Token:
            properties:
                decimals:
                    description: amount == raw_amount / 10^decimals
                    format: uint8
                    type: integer
                max_daily_withdrawal:
                    description: Rolling 24h ceiling; empty when unset
                    type: string
                max_withdrawal:
                    description: Per-order ceiling as a decimal string; empty when not withdrawable
                    type: string
                symbol:
                    type: string
                token_id:
                    description: Value to pass as token_id; the contract address, or empty for the native asset
                    type: string
                withdrawable:
                    type: boolean
            type: object
        Withdrawal:
            properties:
                amount:
                    type: string
                chain:
                    type: string
                confirmed_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                external_id:
                    type: string
                failed_reason:
                    type: string
                held_reason:
                    type: string
                status:
                    type: string
                to_address:
                    type: string
                token_id:
                    type: string
                tx_hash:
                    type: string
            type: object
info:
    description: Deposit address allocation and payout submission.
    title: EarnWallet API
    version: 1.0.0
openapi: 3.0.0
paths:
    /v1/chain/list:
        post:
            operationId: ListChains
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ListChainsReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/ListChainsRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: List the chains and tokens this deployment supports
            tags:
                - Chain
    /v1/deposit/list:
        post:
            operationId: ListDeposits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ListDepositsReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/ListDepositsRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: List credited deposits for reconciliation
            tags:
                - Deposit
    /v1/wallet/get:
        post:
            operationId: GetWallet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GetWalletReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/GetWalletRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: Get a deposit wallet by seed or address, or take a new one
            tags:
                - Wallet
    /v1/withdrawal/get:
        post:
            operationId: GetWithdrawal
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GetWithdrawalReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/GetWithdrawalRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: Read one payout order
            tags:
                - Withdrawal
    /v1/withdrawal/list:
        post:
            operationId: ListWithdrawals
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ListWithdrawalsReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/ListWithdrawalsRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: List payout orders for reconciliation
            tags:
                - Withdrawal
    /v1/withdrawal/submit:
        post:
            operationId: CreateWithdrawal
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateWithdrawalReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 0 on success; any other value is a business failure.
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/CreateWithdrawalRes'
                                    message:
                                        type: string
                                required:
                                    - code
                                    - message
                                type: object
                    description: Success. code is 0 and data carries the result.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A business failure. HTTP stays 200; code is non-zero.
            summary: Submit a payout order
            tags:
                - Withdrawal
