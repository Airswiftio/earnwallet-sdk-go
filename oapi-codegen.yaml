# The types and one method per operation are generated; everything that needs
# judgement is hand-written in client.go.
#
# client.tmpl replaces oapi-codegen's stock client, which imports
# oapi-codegen/runtime to encode query strings and pulls two more modules in
# behind it. Generating the methods keeps the client in step with the API as
# routes are added; the template keeps that from costing a dependency.
#
# Regenerate with `go generate ./...`; openapi.yaml comes from the service.
package: earnwallet
output: client.gen.go
generate:
  models: true
  client: true
output-options:
  skip-prune: true
  user-templates:
    client.tmpl: templates/client.tmpl
    client-with-responses.tmpl: templates/client-with-responses.tmpl
