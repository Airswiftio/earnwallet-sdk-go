# Only the types are generated. The client is hand-written in client.go so the
# SDK carries no third-party dependencies: generating it pulls in
# oapi-codegen/runtime for query-string encoding, and with it go-jsonmerge and
# uuid, none of which this API needs.
#
# Regenerate with `go generate ./...`; the spec comes from the service.
package: earnwallet
output: models.gen.go
generate:
  models: true
output-options:
  skip-prune: true
