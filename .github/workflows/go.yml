name: go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...

      # The checked-in types must match the checked-in specification. A spec
      # updated without regenerating would ship types that do not describe the
      # API they were exported from. The generator version is pinned in
      # generate.go, so this runs exactly what a developer runs.
      - name: models.gen.go is up to date
        run: |
          go generate ./...
          git diff --exit-code models.gen.go

      # A published SDK must not widen anyone's dependency graph. Checked at
      # module level: the package list is full of stdlib-vendored paths that
      # are not dependencies at all.
      - name: no third-party modules
        run: |
          modules=$(go list -m all | grep -v '^github.com/Airswiftio/earnwallet-sdk-go$' || true)
          if [ -n "$modules" ]; then
            echo "unexpected modules:"; echo "$modules"; exit 1
          fi
